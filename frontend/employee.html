<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role - Sewer Monitoring</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>

<body class="role-body">

    <div class="d-flex flex-column align-items-center justify-content-center min-vh-100">

        <div class="text-center mb-5">
            <h2 class="fw-bold text-white">Select Your Role</h2>
            <p class="text-secondary">Choose your workstation to continue</p>
        </div>

        <div class="container">
            <div class="row g-4 justify-content-center">

                <div class="col-md-3">
                    <div class="role-card text-center p-4" onclick="selectRole('field')">
                        <i class="fa-solid fa-wrench fa-2x mb-3"></i>
                        <h5 class="fw-semibold text-white">Field Ops</h5>
                        <p class="text-secondary small">Maintenance & repair</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="role-card text-center p-4" onclick="selectRole('monitor')">
                        <i class="fa-solid fa-desktop fa-2x mb-3"></i>
                        <h5 class="fw-semibold text-white">Monitoring</h5>
                        <p class="text-secondary small">Live system data</p>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="role-card text-center p-4" onclick="selectRole('supervisor')">
                        <i class="fa-solid fa-user-shield fa-2x mb-3"></i>
                        <h5 class="fw-semibold text-white">Supervisor</h5>
                        <p class="text-secondary small">Control & alerts</p>
                    </div>
                </div>

            </div>
        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
