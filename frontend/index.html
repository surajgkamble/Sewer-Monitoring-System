<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sewer Monitoring System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body d-flex align-items-center justify-content-center">

    <div class="overlay"></div>

    <div class="login-card p-5 position-relative z-2" style="width: 100%; max-width: 400px;">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-white">Sewer Monitoring</h2>
            <p class="text-secondary small">Smart IoT Dashboard</p>
        </div>

        <form onsubmit="loginUser(event)">
            
            <div class="mb-3">
                <label for="email" class="visually-hidden">Email</label>
                <input 
                    type="email" 
                    id="email" 
                    class="form-control" 
                    placeholder="Enter email" 
                    autocomplete="email"
                    required>
            </div>

            <div class="mb-4">
                <label for="password" class="visually-hidden">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    class="form-control" 
                    placeholder="Enter password" 
                    autocomplete="current-password"
                    required>
            </div>

            <button type="submit" class="btn btn-login w-100 fw-bold">
                Login
            </button>
        </form>

        <p class="text-center mt-3">
            <a href="register.html" class="text-info text-decoration-none">
                Create Account
            </a>
        </p>

        <p class="text-center text-secondary small mt-2">
            Municipal Monitoring System
        </p>
    </div>

    <script src="auth.js"></script>
</body>
</html>
